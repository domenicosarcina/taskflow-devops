name: TaskFlow CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main 
      - develop

permissions:
  contents: read 

env:
  AWS_REGION: eu-west-1
  ECR_BACKEND: taskflow-backend
  ECR_FRONTEND: taskflow-frontend
  ECS_CLUSTER: taskflow-cluster
  ECS_SERVICE: taskflow-service
  ECS_TASK_DEFINITION: infra/ecs/task-definition.json
  CONTAINER_NAME: taskflow-backend

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo 
        uses: actions/checkout@v4
      
      - name: Configure Java 17 temurin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ./backend/pom.xml
      
      - name: Maven build
        working-directory: ./backend
        run: mvn verify

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar 
          path: backend/target/*.jar
      
      - name: Upload Surefire reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: error
  
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Configure Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci 

      - name: Build frontend
        run: npm run build
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
  
  docker:
    needs: [backend, frontend]
    if: github.event_name == "push" && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      backend-image: ${{ steps.build-image.outputs.backend-image }}
      frontend-image: ${{ steps.build-image.outputs.frontend-image }}
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      
      - name: COnfigure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Docker build image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND }}:${{ github.sha }}
          cache-from: type=gha, scope=backend
          cache-to: type=gha, mode=max, scope=backend
      
      - name: Docker build image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha, scope=frontend
          cache-to: type=gha, mode=max, scope=frontend
      
      - name: Pusblish image outputs
        id: publish 
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "backend-image=$ECR_REGISTRY/$ECR_BACKEND:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "frontend-image=$ECR_REGISTRY/$ECR_FRONTEND:$IMAGE_TAG" >> $GITHUB_OUTPUT
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == "refs/heads/main" && github.event_name == "push"
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout repo 
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Render ECS Task Definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: task-def
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.docker.outputs.backend-image }}
      
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true

  health-check:
    needs: deploy
    if: github.ref == "refs/heads/main"
    runs-on: ubuntu-latest
    env:
      HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
    steps:
      - name: Test Health URL 
        run: |
          curl -fsS \
              --retry 5 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 5 \
              --max-time 15 \
              "$HEALTH_URL"
