backend:
  replicas: 2
  image:
    repository: taskflow-backend
    tag: 1.0.0
  ports:
    port: 80
    containerPort: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  service:
    type: ClusterIP

frontend:
  replicas: 2
  image:
    repository: taskflow-frontend
    tag: 1.0.0
  ports:
    port: 80
    containerPort: 80
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  service:
    type: ClusterIP

postgres:
  replicas: 1
  image:
    repository: postgres
    tag: 13
  ports:
    containerPort: 5432
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  service:
    type: ClusterIP
  storage: 1Gi

ingress:
  enabled: true
  className: nginx
  host: taskflow.example.com
  paths:
    frontend:
      path: /
      service: frontend-service
      port: 80
    backend:
      path: /api
      service: backend-service
      port: 80

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70